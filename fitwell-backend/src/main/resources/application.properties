spring.application.name=fitwell-backend
server.port=${PORT:8080}

# Credentials come from environment variables or the gitignored application-local.properties.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/fitwell_lk?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# Flyway owns the schema; Hibernate only checks that entities match it.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.flyway.enabled=true

# HS256 key, base64 encoded, at least 32 bytes. Must be supplied, there is no default.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:168}

spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null
